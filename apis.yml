  - Fintech
  - B2B Payments
apis:
  - name: Tipalti REST API
    description: >
      Modern RESTful API for payee onboarding, payment processing, invoice management,
      and procurement workflows. Uses JSON encoding, OAuth 2.0 authentication, and
      supports operations across 200+ countries and territories.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://developer.tipalti.com/
    baseURL: https://api.tipalti.com
    tags:
      - REST
      - Payments
      - Payees
      - Invoices
      - Procurement
    properties:
      - type: Documentation
        url: https://developer.tipalti.com/
      - type: OpenAPI
        url: https://developer.tipalti.com/
  - name: Tipalti SOAP API
    description: >
      Legacy SOAP-based API providing Payer and Payee functions including payee registration,
      payment processing, and payer administrative operations. Currently at version 14 with
      endpoints for both sandbox and production environments.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://soap-support.tipalti.com/Content/Topics/APIs/Intro.htm
    baseURL: https://api.tipalti.com
    tags:
      - SOAP
      - Payments
      - Payees
      - Payer
    properties:
      - type: Documentation
        url: https://soap-support.tipalti.com/Content/Topics/APIs/Intro.htm
  - name: Tipalti Procurement REST API
    description: >
      REST API providing programmatic access to Tipalti Procurement data, enabling
      integration for purchase orders, purchase requisitions, and procurement workflows.
      Designed for low-frequency polling with rate limits of 5 requests per minute for
      updates and a 10-minute interval for reads.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://help.tipalti.com/hc/en-us/articles/30718248220823-Procurement-REST-API-documentation
    baseURL: https://api.tipalti.com
    tags:
      - REST
      - Procurement
      - Purchase Orders
      - Purchase Requisitions
    properties:
      - type: Documentation
        url: https://help.tipalti.com/hc/en-us/articles/30718248220823-Procurement-REST-API-documentation
