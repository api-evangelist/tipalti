specificationVersion: "0.19"
description: >
  Tipalti is a global accounts payable and mass payments automation platform that enables
  businesses to onboard suppliers, process payments across 196 countries in 120 currencies
  using 50+ payment methods, and automate invoice processing and tax compliance. The platform
  exposes a modern REST API for programmatic payee management, payment processing, invoice
  creation, and procurement workflows, alongside a legacy SOAP API for payer and payee
  functions that remains in use for existing integrations. Authentication uses OAuth 2.0
  client credentials for the REST API and HMAC-based request signing for the SOAP API.
  Tipalti operates dedicated sandbox and production environments, with documentation and
  developer resources available through the Tipalti Developer Hub at developer.tipalti.com.
tags:
  - Accounts Payable
  - Mass Payments
  - Global Payments
  - Payee Onboarding
  - Invoice Management
  - Tax Compliance
